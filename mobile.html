<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罗塞塔 · 拼图定位</title>
<style>
:root{--paper:#f3f0e8;--ink:#26362f;--muted:#6e766d;--line:#dfdfd4;--green:#315644;--accent:#dc653d;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{min-height:44px;cursor:pointer;border:1px solid transparent;border-radius:10px;padding:10px 16px;background:var(--green);color:white;font-weight:600}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #cc9b4d;outline-offset:3px}.secondary{background:#edf0e8;color:var(--green);border-color:#dce1d6}.quiet{background:transparent;color:var(--green);border-color:var(--line)}h1,h2,h3,p,figure{margin:0}h1{font-family:Georgia,"Songti SC",SimSun,serif;font-size:30px;letter-spacing:.04em}h2{font-size:18px}h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:13px}.shell{max-width:1240px;margin:auto;padding:28px 24px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:4px}.local{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 12px;border-radius:30px;white-space:nowrap}.local:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#6f8e68;margin-right:7px}.workspace{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}.card{background:#fffdf8;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.piece-card{padding:22px}.section-label{display:flex;align-items:center;gap:10px;margin-bottom:16px}.number{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e9eee3;color:var(--green);font-size:12px;font-weight:700}.preview-frame{display:flex;align-items:center;justify-content:center;height:226px;border:1px dashed #cfd4c5;border-radius:13px;background:repeating-conic-gradient(#e9ece5 0% 25%,#f5f7f1 0% 50%) 0 0/18px 18px;overflow:hidden;margin-bottom:12px}.preview-frame img{max-width:100%;max-height:100%;object-fit:contain;padding:14px}.empty-piece{text-align:center;padding:24px;color:var(--muted)}.empty-icon{font-size:38px;font-weight:200;display:block;line-height:1.4;margin-bottom:8px}.tabs{display:flex;gap:4px;margin-bottom:14px}.tabs button{flex:1;min-height:34px;padding:4px 10px;font-size:12px;background:transparent;color:var(--muted)}.tabs button.active{background:#e9eee3;color:var(--green)}.capture-actions{display:flex;gap:8px}.capture-actions button{flex:1}.primary{width:100%;margin-top:16px}.status{font-size:13px;color:var(--muted);min-height:42px;margin-top:12px;overflow-wrap:anywhere}.status.error{color:#a03c26}.status.loading:before{content:"";display:inline-block;width:11px;height:11px;border:2px solid #d8dfd1;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-right:7px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}details{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}summary{cursor:pointer;font-size:13px;color:var(--green);padding:4px 0}label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input[type=range]{width:100%;accent-color:var(--green)}.adjust-copy{font-size:12px;color:var(--muted);margin:6px 0 12px}.tool-actions{display:flex;flex-wrap:wrap;gap:6px}.tool-actions button{font-size:12px;padding:7px 10px;min-height:38px}#photoCanvas{display:block;max-width:100%;width:auto;height:auto;max-height:360px;margin:12px auto;background:#eee;border-radius:8px}#photoCanvas.selecting{outline:3px solid var(--accent);touch-action:none;cursor:crosshair}.board-top{padding:20px 22px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.board-title small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.board-top button{font-size:12px;padding:7px 12px;min-height:36px}.board-stage{height:560px;position:relative;background:radial-gradient(ellipse at 50% 45%,#e2e2d8,#edece5 72%);border-block:1px solid var(--line);overflow:hidden}#referenceCanvas{width:100%;height:100%;display:block;touch-action:pan-y}#referenceCanvas.zoomed{touch-action:none;cursor:grab}.board-hint{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.04em;color:#667160;background:#f8f8f0df;padding:5px 9px;border-radius:6px;pointer-events:none}.zoom-tools{position:absolute;bottom:15px;right:15px;display:flex;gap:4px;background:#fffdf8e8;padding:5px;border:1px solid #d6d9ce;border-radius:12px}.zoom-tools button{background:transparent;color:var(--ink);padding:4px 12px;font-size:18px;min-width:38px;min-height:36px}.zoom-tools #resetView{font-size:11px;min-width:56px}.board-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}.result-area{padding:18px 22px 22px}.result-empty{font-size:13px;color:var(--muted);text-align:center;padding:5px 0}.candidate-list{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.candidate-list button{background:#f2f2ea;color:var(--muted);font-size:12px;padding:7px 12px;min-height:36px;border-color:var(--line)}.candidate-list button.active{background:var(--green);color:white;border-color:var(--green)}.location-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.location-row strong{font-size:16px}.turn{font-size:12px;color:var(--green);background:#edf1e8;padding:5px 8px;border-radius:7px;white-space:nowrap}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-grid figure{min-width:0}.detail-grid figcaption{font-size:12px;color:var(--muted);margin-bottom:7px}.detail-grid canvas{display:block;width:100%;height:190px;object-fit:contain;border-radius:10px;background:#e9e9e0;border:1px solid #dcded2}.result-note{font-size:12px;color:var(--muted);margin-top:12px}.overlay-option{display:flex;gap:7px;align-items:center;margin:12px 0 0;font-size:12px;font-weight:400}.overlay-option input{accent-color:var(--green)}footer{text-align:center;color:#858b7f;font-size:11px;margin-top:22px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}[hidden]{display:none!important}@media(min-width:1000px){.piece-card{position:sticky;top:20px}}@media(max-width:800px){.shell{padding:20px 14px 30px}header{margin-bottom:18px;align-items:flex-start}h1{font-size:25px}.local{font-size:10px;padding:5px 8px}.workspace{grid-template-columns:1fr;gap:16px}.piece-card{padding:18px}.preview-frame{height:175px}.capture-actions{max-width:none}.board-stage{height:480px}.has-result .board-card{order:-1}.board-top{padding:17px 16px 12px}.result-area{padding:16px}.detail-grid{gap:9px}.detail-grid canvas{height:160px}.location-row{align-items:flex-start}.location-row strong{font-size:14px}.turn{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
<div class="shell">
<header><div><div class="eyebrow">THE ROSETTA STONE · 800 PIECES</div><h1>罗塞塔 · 拼图定位</h1></div><span class="local">照片本地处理</span></header>
<main class="workspace" id="workspace">
  <section class="card piece-card" aria-label="拍摄与处理单块拼图">
    <div class="section-label"><span class="number">1</span><h2>手中的这一块</h2></div>
    <div class="preview-frame"><div class="empty-piece" id="pieceEmpty"><span class="empty-icon">＋</span><strong>拍一块，找位置</strong><p class="small">正面靠近拍摄，让文字清楚一些</p></div><img id="cutout" alt="去背景后的拼图" hidden><img id="binary_preview" alt="黑底白字处理结果" hidden></div>
    <div class="tabs" id="previewTabs" hidden aria-label="切换拼图预览"><button id="showCutout" class="active" aria-pressed="true">去背景</button><button id="showBinary" aria-pressed="false">黑白文字</button></div>
    <input id="piece" type="file" accept="image/*" class="sr-only" aria-label="选择单块拼图照片"><input id="camera" type="file" accept="image/*" capture="environment" class="sr-only" aria-label="拍摄单块拼图">
    <div class="capture-actions"><button id="takePhoto">拍一块</button><button id="choosePhoto" class="secondary">选择照片</button></div>
    <button id="locate" class="primary" disabled>查找位置</button>
    <p id="status" class="status" role="status" aria-live="polite">拍照后自动去背景并查找位置。</p>
    <details id="adjustments"><summary>轮廓或黑白效果不对？调整</summary>
      <p class="adjust-copy">自动识别靠近中央的拼图。若截错，在原照片上框选整块，留一点背景。</p>
      <canvas id="photoCanvas" hidden aria-label="原照片，在框选模式下拖动圈住整块拼图"></canvas>
      <div class="tool-actions"><button id="select" class="secondary" disabled>框选拼图</button><button id="automatic" class="quiet" disabled>恢复自动识别</button></div>
      <label for="strength">黑白分割强度 <output id="strengthValue">8</output></label><input id="strength" type="range" min="-20" max="35" value="8" disabled>
      <p class="adjust-copy">向左保留笔画，向右清理灰底。调整后，点击“用当前效果定位”。</p><button id="preprocess" class="quiet" disabled>重新处理预览</button>
    </details>
  </section>
  <section class="card board-card" id="boardCard" aria-label="石碑位置与文字对照">
    <div class="board-top"><div class="board-title"><h2>它应该放在这里</h2><small id="boardState">整张石碑已内置，直接拍摄单块即可</small></div><button id="nextPiece" class="quiet" disabled>拍下一块</button></div>
    <div class="board-stage" id="boardViewport"><canvas id="referenceCanvas" aria-label="石碑全图，可放大并拖动查看候选位置"></canvas><span class="board-hint">按石碑真实轮廓定位</span><div id="boardLoading" class="board-loading">正在载入石碑…</div><div class="zoom-tools" aria-label="底图缩放"><button id="zoomOut" aria-label="缩小底图">−</button><button id="resetView">看全碑</button><button id="zoomIn" aria-label="放大底图">＋</button></div></div>
    <div class="result-area"><p id="resultEmpty" class="result-empty">定位后，可同时查看整碑位置与文字细节。</p><div id="resultContent" hidden>
      <div id="matches" class="candidate-list" aria-label="切换候选位置"></div>
      <div class="location-row"><div><strong id="locationLabel"></strong><p id="locationPercent" class="small muted"></p></div><span id="turnHint" class="turn"></span></div>
      <div class="detail-grid"><figure><figcaption>你的拼图 · 已按放置方向对齐</figcaption><canvas id="pieceDetail" aria-label="按候选方向对齐的实拍拼图"></canvas></figure><figure><figcaption>石碑上对应的文字</figcaption><canvas id="detail" aria-label="石碑候选区域的放大图"></canvas></figure></div>
      <label class="overlay-option"><input id="overlay" type="checkbox">把这块拼图叠在整碑上看</label><p id="resultNote" class="result-note"></p>
    </div></div>
  </section>
</main><footer>罗塞塔石碑拼图助手 · 局域网内运行</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let pieceData,photo,photoOutline,cutoutImage,refImage,box=null,prepared=false,busy=false,selecting=false,start=null,matches=[],active=0;
let zoom=1,panX=0,panY=0,drag=null;
function report(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);$('status').classList.toggle('loading',busy);}
function updateButtons(){
  for(const id of ['piece','camera','takePhoto','choosePhoto'])$(id).disabled=busy;
  for(const id of ['preprocess','select','automatic','strength','showCutout','showBinary'])$(id).disabled=busy||!pieceData;
  $('locate').disabled=busy||!prepared||!refImage;$('nextPiece').disabled=busy||!pieceData;
  $('locate').textContent=busy?'正在识别…':matches.length?'重新定位':prepared?'用当前效果定位':'查找位置';
}
async function imageFromURL(url){const image=new Image();image.src=url;await image.decode();return image;}
async function loadFile(file){
  if(!file||!file.type.startsWith('image/')||file.size>20*1024*1024)throw Error('请选择不超过 20 MB 的图片。');
  const image=await createImageBitmap(file);try{if(image.width*image.height>40000000)throw Error('图片太大，请缩小后再试。');
    const ratio=Math.min(1,2000/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*ratio));canvas.height=Math.max(1,Math.round(image.height*ratio));const context=canvas.getContext('2d');context.fillStyle='white';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.97);
  }finally{image.close();}
}
function preview(binary=false){$('cutout').hidden=binary;$('binary_preview').hidden=!binary;for(const [id,on]of [['showCutout',!binary],['showBinary',binary]]){$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',String(on));}}
function clearMatches(){matches=[];active=0;$('matches').replaceChildren();$('resultContent').hidden=true;$('resultEmpty').hidden=false;$('overlay').checked=false;$('workspace').classList.remove('has-result');drawReference();}
function drawPhoto(selection=box){if(!photo)return;const canvas=$('photoCanvas');canvas.width=photo.width;canvas.height=photo.height;const ctx=canvas.getContext('2d');ctx.drawImage(photoOutline||photo,0,0);canvas.hidden=false;if(selection){const[a,b,c,d]=selection;ctx.strokeStyle='#e16c3e';ctx.lineWidth=Math.max(3,photo.width/200);ctx.strokeRect(a*photo.width,b*photo.height,(c-a)*photo.width,(d-b)*photo.height);}}
function viewGeometry(){const width=$('boardViewport').clientWidth,height=$('boardViewport').clientHeight,fit=refImage?Math.min((width-34)/refImage.width,(height-30)/refImage.height):1;return{width,height,fit,scale:fit*zoom};}
function paintPiece(ctx,points){if(!cutoutImage)return;ctx.save();ctx.transform((points[1][0]-points[0][0])/cutoutImage.width,(points[1][1]-points[0][1])/cutoutImage.width,(points[3][0]-points[0][0])/cutoutImage.height,(points[3][1]-points[0][1])/cutoutImage.height,points[0][0],points[0][1]);ctx.drawImage(cutoutImage,0,0);ctx.restore();}
function outline(ctx,points,width){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.lineWidth=width;ctx.strokeStyle='#e26b3c';ctx.stroke();}
function drawReference(){
  const canvas=$('referenceCanvas'),{width,height,scale}=viewGeometry();if(!width||!height)return;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);if(!refImage)return;
  ctx.translate((width-refImage.width*scale)/2+panX,(height-refImage.height*scale)/2+panY);ctx.scale(scale,scale);ctx.drawImage(refImage,0,0);
  if(matches[active]){const points=matches[active].polygon;if($('overlay').checked){ctx.save();ctx.globalAlpha=.85;paintPiece(ctx,points);ctx.restore();}outline(ctx,points,2.5/scale);const cx=points.reduce((s,p)=>s+p[0],0)/4,cy=points.reduce((s,p)=>s+p[1],0)/4;ctx.beginPath();ctx.arc(cx,cy,4/scale,0,Math.PI*2);ctx.fillStyle='#e26b3c';ctx.fill();}
  canvas.classList.toggle('zoomed',zoom>1);
}
function resetView(){zoom=1;panX=panY=0;drawReference();}
function changeZoom(factor){zoom=Math.max(1,Math.min(8,zoom*factor));if(zoom===1){panX=panY=0;}else if(matches[active]){const center=matches[active].polygon.reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4],[0,0]);const{scale}=viewGeometry();panX=(refImage.width/2-center[0])*scale;panY=(refImage.height/2-center[1])*scale;}drawReference();}
function drawDetails(points){
  const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),padding=Math.max(12,Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*.22);
  const x=Math.max(0,Math.min(...xs)-padding),y=Math.max(0,Math.min(...ys)-padding),width=Math.min(refImage.width-x,Math.max(...xs)-x+padding),height=Math.min(refImage.height-y,Math.max(...ys)-y+padding);const scale=Math.min(4,640/Math.max(width,height));
  for(const id of ['pieceDetail','detail']){const canvas=$(id);canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);const ctx=canvas.getContext('2d');ctx.setTransform(scale,0,0,scale,-x*scale,-y*scale);if(id==='detail'){ctx.drawImage(refImage,0,0);outline(ctx,points,1/scale);}else paintPiece(ctx,points);}
}
function showMatch(index){
  active=index;const match=matches[index],points=match.polygon;const cx=points.reduce((s,p)=>s+p[0],0)/4/refImage.width,cy=points.reduce((s,p)=>s+p[1],0)/4/refImage.height;
  const zone=cy<.25?'象形文字区':cy<.30?'两种文字交界':cy<.57?'世俗体文字区':'希腊文区';const side=cx<.33?'左侧':cx>.67?'右侧':'中央';$('locationLabel').textContent=`${zone} · ${side}`;$('locationPercent').textContent=`距整图左侧约 ${Math.round(cx*100)}%，距顶部约 ${Math.round(cy*100)}%`;
  const angle=Math.atan2(points[1][1]-points[0][1],points[1][0]-points[0][0])*180/Math.PI;const amount=Math.round(Math.abs(angle)/5)*5;$('turnHint').textContent=amount<5?'方向基本一致':amount>=175?'把拼图转半圈':`向${angle<0?'左':'右'}转约 ${amount}°`;
  [...$('matches').children].forEach((button,i)=>{button.classList.toggle('active',i===index);button.setAttribute('aria-pressed',String(i===index));});$('boardState').textContent=index===0?'当前显示首选位置':'当前显示另一个可能位置';$('resultNote').textContent='先比较两侧文字，再根据整碑位置放置这块拼图。';resetView();drawDetails(points);
}
async function analyze(operation){
  if(busy||!pieceData)return false;const started=performance.now();busy=true;if(operation!=='match')prepared=false;clearMatches();updateButtons();$('boardState').textContent=operation==='match'?'正在石碑轮廓内查找…':'正在提取单块拼图…';report(operation==='match'?'正在查找位置…':'正在去背景并分离黑白文字…');
  try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation,piece:pieceData,strength:Number($('strength').value),box})});const result=await response.json();if(!response.ok)throw Error(result.error||'处理失败。');
    $('cutout').src=result.cutout;$('binary_preview').src=result.binary_preview;cutoutImage=await imageFromURL(result.cutout);photoOutline=await imageFromURL(result.outlined);drawPhoto();$('pieceEmpty').hidden=true;$('previewTabs').hidden=false;preview($('showBinary').classList.contains('active'));prepared=true;
    if(result.matches){matches=result.matches;if(matches.length){$('resultEmpty').hidden=true;$('resultContent').hidden=false;matches.forEach((match,i)=>{const button=document.createElement('button');button.textContent=i===0?'首选位置':`备选 ${i+1}`;button.onclick=()=>showMatch(i);$('matches').append(button);});$('workspace').classList.add('has-result');showMatch(0);report(`${result.message} 用时 ${((performance.now()-started)/1000).toFixed(1)} 秒。`);$('boardCard').scrollIntoView({behavior:'smooth',block:'start'});}else{$('boardState').textContent='还没有找到合适的位置';report(result.message,true);$('adjustments').open=true;}}
    else{report('预览已更新，可以用当前效果重新定位。');$('boardState').textContent='等待用当前处理效果定位';}return true;
  }catch(error){report(error.message||'无法连接电脑，请确认服务正在运行。',true);$('boardState').textContent='识别未完成，可调整后重试';return false;}
  finally{busy=false;updateButtons();$('status').classList.remove('loading');}
}
async function receivePhoto(input){
  if(!input.files.length||busy)return;busy=true;prepared=false;pieceData=null;box=null;photoOutline=null;cutoutImage=null;clearMatches();resetView();$('pieceEmpty').hidden=false;$('cutout').hidden=$('binary_preview').hidden=true;$('previewTabs').hidden=true;$('photoCanvas').hidden=true;$('adjustments').open=false;selecting=false;start=null;$('select').textContent='框选拼图';$('photoCanvas').classList.remove('selecting');$('strength').value=8;$('strengthValue').textContent='8';preview(false);$('cutout').hidden=true;updateButtons();report('正在读取照片…');
  try{pieceData=await loadFile(input.files[0]);photo=await imageFromURL(pieceData);drawPhoto();busy=false;if(await analyze('preprocess')){await boardReady;if(refImage)await analyze('match');}}
  catch(error){report(error.message,true);}finally{busy=false;input.value='';updateButtons();$('status').classList.remove('loading');}
}
$('piece').onchange=()=>receivePhoto($('piece'));$('camera').onchange=()=>receivePhoto($('camera'));$('takePhoto').onclick=()=>{$('camera').value='';$('camera').click();};$('choosePhoto').onclick=()=>{$('piece').value='';$('piece').click();};$('nextPiece').onclick=()=>{$('camera').value='';$('camera').click();};
$('showCutout').onclick=()=>preview(false);$('showBinary').onclick=()=>preview(true);
$('strength').oninput=()=>{$('strengthValue').textContent=$('strength').value;prepared=false;clearMatches();updateButtons();};$('strength').onchange=async()=>{await analyze('preprocess');preview(true);};$('preprocess').onclick=()=>analyze('preprocess');$('locate').onclick=()=>analyze('match');
$('select').onclick=()=>{selecting=!selecting;$('photoCanvas').classList.toggle('selecting',selecting);$('select').textContent=selecting?'退出框选':'框选拼图';report(selecting?'在原照片上圈住整块拼图，并留一点背景。':'已退出框选。');};$('automatic').onclick=()=>{box=null;drawPhoto();analyze('preprocess');};
function position(event){const r=$('photoCanvas').getBoundingClientRect();return[Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(event.clientY-r.top)/r.height))];}
$('photoCanvas').onpointerdown=event=>{if(!selecting||busy)return;start=position(event);$('photoCanvas').setPointerCapture(event.pointerId);};$('photoCanvas').onpointermove=event=>{if(!start)return;const end=position(event);drawPhoto([Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])]);};
$('photoCanvas').onpointerup=event=>{if(!start)return;const end=position(event),selection=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])];start=null;if(selection[2]-selection[0]<.03||selection[3]-selection[1]<.03){drawPhoto();report('框选太小，请圈住整块拼图。',true);return;}box=selection;selecting=false;$('photoCanvas').classList.remove('selecting');$('select').textContent='框选拼图';drawPhoto();analyze('preprocess');};$('photoCanvas').onpointercancel=()=>{start=null;drawPhoto();};
$('zoomIn').onclick=()=>changeZoom(1.5);$('zoomOut').onclick=()=>changeZoom(1/1.5);$('resetView').onclick=resetView;$('overlay').onchange=drawReference;
$('referenceCanvas').onpointerdown=event=>{if(zoom<=1)return;drag={x:event.clientX,y:event.clientY,panX,panY};$('referenceCanvas').setPointerCapture(event.pointerId);};$('referenceCanvas').onpointermove=event=>{if(!drag)return;panX=drag.panX+event.clientX-drag.x;panY=drag.panY+event.clientY-drag.y;drawReference();};$('referenceCanvas').onpointerup=$('referenceCanvas').onpointercancel=()=>{drag=null;};
new ResizeObserver(drawReference).observe($('boardViewport'));
const boardReady=(async()=>{try{refImage=await imageFromURL('/api/board');$('boardLoading').hidden=true;drawReference();updateButtons();}catch{$('boardLoading').textContent='石碑底图加载失败，请刷新页面。';report('无法载入内置底图，请确认电脑服务正常。',true);}})();
</script>
</html>
